# Every tunable setting for the chatbot (spec §4.4, decisions D10–D13).
# Change one value at a time and rerun the eval (eval/run_eval.py).

content_url: https://ryebriscoe.github.io/chatbot-content.json
embed_model: BAAI/bge-small-en-v1.5
gen_model: HuggingFaceTB/SmolLM2-360M-Instruct   # placeholder until model selection (D15)

# --- retrieval (finding the right chunks) ---
# bge models expect this instruction in front of questions, not in front of chunks (D15)
query_prefix: "Represent this sentence for searching relevant passages: "
top_k: 4                  # chunks retrieved per question
keyword_weight: 0.2       # score = meaning + keyword_weight * keyword match (D16)
min_score: 0.5            # chunks scoring below this are ignored; if none pass, the bot
                          # replies "not covered" without running the model (D17)

# --- generation (writing the answer) ---
history_turns: 2          # previous exchanges sent with each question
temperature: 0.2
max_new_tokens: 250
max_question_chars: 500
max_sources: 3
