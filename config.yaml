# Every tunable setting for the chatbot (spec §4.4, decisions D10–D18).
# Change one value at a time and rerun the eval (eval/run_eval.py).

content_url: https://ryebriscoe.github.io/chatbot-content.json
embed_model: BAAI/bge-small-en-v1.5
# Where answers are written (D23): "groq" calls Groq's hosted API (no per-visitor
# GPU limits); "hf" runs gen_model on the Space's ZeroGPU (D20 picked Qwen3-4B for that).
generator: groq
gen_model: openai/gpt-oss-20b       # Groq model id, chosen by the Groq comparison (D24)
reasoning_effort: low               # gpt-oss thinks before answering; keep it short

# --- retrieval (finding the right chunks) ---
# bge models expect this instruction in front of questions, not in front of chunks (D15)
query_prefix: "Represent this sentence for searching relevant passages: "
top_k: 4                  # chunks retrieved per question
keyword_weight: 0.2       # score = meaning + keyword_weight * keyword match (D16)
min_score: 0.5            # chunks scoring below this are ignored; if none pass, the bot
                          # replies "not covered" without running the model (D17)

# --- generation (writing the answer) ---
history_turns: 2          # previous exchanges sent with each question
temperature: 0.2
max_new_tokens: 1024      # includes the model's hidden reasoning; the prompt keeps answers to 2-4 sentences
max_question_chars: 500
max_sources: 3
source_margin: 0.1        # sources = retrieved pages closest to the answer, within 0.1 of the best (D26)
source_retrieval_weight: 0.5  # source score = match to the answer + 0.5 x search score (D26)
